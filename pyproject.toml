[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-session"
version = "0.1.0"
description = "Create a Colab session with optional GitHub repository and Google Drive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-colab-cli==0.7.4",
    "jupyter-kernel-client==0.9.0",
]

[project.scripts]
colab-ssh = "colab_ssh:main"
colab-ssh-server = "colab_server:main"

[tool.setuptools]
py-modules = [
    "colab_ssh",
    "colab_server",
    "session_manager",
    "credentials",
    "setup_environment",
    "setup_gpu",
    "setup_ssh",
    "ssh_proxy",
]

[tool.uv]
package = true
