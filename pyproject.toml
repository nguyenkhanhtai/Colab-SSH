[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-session"
version = "0.2.0"
description = "Create Colab GPU sessions with SSH, Drive backups, and remote job execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-colab-cli>=0.7.5",
    "jupyter-kernel-client==0.9.0",
]

[project.scripts]
colab-ssh = "colab_session.cli.main:main"
colab-ssh-server = "colab_session.cli.server:main"
colab-mcp = "colab_session.mcp.server:main"

[tool.setuptools]
packages = [
    "colab_session",
    "colab_session.auth",
    "colab_session.ssh",
    "colab_session.hardware",
    "colab_session.env",
    "colab_session.storage",
    "colab_session.session",
    "colab_session.jobs",
    "colab_session.server",
    "colab_session.cli",
    "colab_session.mcp",
    "colab_session.tracking",
]

[tool.setuptools.package-data]
colab_session = [
    "server/templates/*",
    "scripts/*",
]

[tool.uv]
package = true
